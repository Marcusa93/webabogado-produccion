# Disparo MANUAL de /api/cron-telegram-reminders (Actions → telegram-reminders-cron → Run workflow).
#
# El disparo horario lo hace cron-job.org (minuto 5 de cada hora, header
# "Authorization: Bearer <CRON_SECRET>"). Se dejó de usar el schedule de GitHub
# porque en repos públicos se desactiva tras 60 días sin commits y además saltea
# corridas. No vuelvas a agregar un schedule acá: dos disparos en la misma hora
# duplican los avisos de Telegram.
#
# Setup:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  CRON_SECRET
#   Value: el mismo valor que está en Vercel (env var CRON_SECRET)

name: telegram-reminders-cron

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set in repo settings"
            exit 1
          fi
          # Reintenta errores transitorios (502 = Cal.com falló antes de mandar pings).
          response=$(curl -sS --retry 2 --retry-delay 20 -w "\nHTTP_%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.marcorossi.com.ar/api/cron-telegram-reminders")
          echo "$response"
          echo "$response" | grep -q "HTTP_200" || exit 1
